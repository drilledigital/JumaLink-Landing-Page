services:
  - type: web
    name: jumalink-landing-page
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    
    # Custom headers for security and caching
    headers:
      # Aggressive caching for SvelteKit assets (immutable files)
      - path: /_app/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      
      # Core security headers
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      
      # HSTS (SEO and Security boost)
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
    
    # Redirect old URLs to new clean URLs (if needed)
    routes:
      - type: redirect
        source: /privacy.html
        destination: /privacy/
        permanent: true
      - type: redirect
        source: /delete-me.html
        destination: /delete-me/
        permanent: true
